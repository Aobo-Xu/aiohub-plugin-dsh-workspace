name: Release runtime

on:
  workflow_dispatch:
    inputs:
      runtime-root:
        description: Runtime artifact root
        required: false
        default: .artifacts/runtime

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            os: windows-latest
            support: supported

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build protocol
        run: bun run build:protocol

      - name: Package platform
        run: >-
          node --experimental-strip-types scripts/package-platform.ts
          --platform ${{ matrix.platform }}
          --support ${{ matrix.support }}
          --runtime-root ${{ github.event.inputs.runtime-root }}
          --out dist/dsh-coding-workspace-0.1.0-${{ matrix.platform }}${{ matrix.support == 'preview' && '-preview' || '' }}.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-coding-workspace-0.1.0-${{ matrix.platform }}${{ matrix.support == 'preview' && '-preview' || '' }}.zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
