[package]
name = "aio-dsh-supervisor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "aio_dsh_supervisor"
path = "src/lib.rs"

[[bin]]
name = "aio-dsh-supervisor"
path = "src/main.rs"

# Test-only stub of the DSH Host JSONL surface; never packaged into releases.
[[bin]]
name = "host-test-stub"
path = "src/bin/host-test-stub.rs"

[dependencies]
aio-dsh-protocol = { path = "../protocol" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
