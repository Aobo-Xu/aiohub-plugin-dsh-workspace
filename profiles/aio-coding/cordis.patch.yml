# AIO Coding profile layer, applied over @deepseek-ai/dsh-base.
# The managed Coding workstation must not upload session telemetry.
- id: session-telemetry-otel
  disabled: true
- id: session-title-llm
  disabled: true

# The official headless runner is one-shot and owns stdout.  AIO replaces only
# that surface; the official DSH service composition remains authoritative.
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true

# Full-text session search is opt-in upstream: the base composition ships the
# session-query index with `openAt: never`, so every search call fails with
# SESSION_QUERY_SEARCH_DISABLED.  The managed workstation enables lazy search
# with a durable index inside the managed DSH Home — the override path the
# runtime itself documents for deployments that need content search.
- id: session-query-sqlite
  config:
    openAt: first-search
    path: !!js dshHomePath('session-query-index.sqlite')

# Public Host controllers used by the release adapter.  These are official DSH
# extension points; the AIO bridge does not import Web BFF or private registry
# modules.
- insert:
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'
    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'
    - id: terminal
      name: '@deepseek-ai/dsh-terminal'
    - id: terminal-shell
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        shellDialect: pwsh
    - id: aiohub-dsh-bridge
      name: __AIO_DSH_HOST_MODULE__
